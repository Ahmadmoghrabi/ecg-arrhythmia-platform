spring.application.name=ecg-api
server.port=8080

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/ecg_platform

# URL of the Python Flask classifier microservice
classifier.url=http://localhost:5001

# Local path to MIT-BIH records (no trailing slash, no file extension)
# Override with MITDB_PATH env var. Replace with S3 path on Day 12.
mitdb.path=${MITDB_PATH:../ml/data/mitdb}

# JWT — set a strong secret in production via environment variable JWT_SECRET
jwt.secret=${JWT_SECRET:ecg-platform-dev-secret-key-must-be-at-least-32-chars}
jwt.expiration-ms=86400000
