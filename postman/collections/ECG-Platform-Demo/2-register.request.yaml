$kind: http-request
name: 2 — Register
method: POST
url: '{{apiUrl}}/api/v1/auth/register'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "demo@ecgplatform.com",
      "password": "securepass123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.collectionVariables.set("token", pm.response.json().token)'
