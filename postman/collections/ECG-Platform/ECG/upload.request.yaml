$kind: http-request
name: 'Upload ECG'
method: POST
url: '{{apiUrl}}/api/v1/ecg/upload'
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "recordId": "100"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.collectionVariables.set("ecgRecordId", pm.response.json().id)'
